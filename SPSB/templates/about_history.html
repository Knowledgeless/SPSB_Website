{% extends "base.html" %}
{% block content %}

<div class="container py-5">

    <h2>About Page History</h2>

    {% for item in history %}
        <div class="card p-3 mb-3">
            <h5>{{ item.title }}</h5>
            <small class="text-muted">
                Updated at {{ item.updated_at }} by {{ item.updated_by }}
            </small>
            <hr>
            <div>{{ item.content|safe }}</div>
        </div>
    {% endfor %}

</div>

{% endblock %}
